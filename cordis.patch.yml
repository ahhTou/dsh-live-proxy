# Inserts the live proxy controller into the running DSH Host.
#
# These values are the profile-level defaults. Settings -> Plugins ->
# dsh-live-proxy edits the same fields and writes them into the profile patch;
# volatile fields apply without restarting DSH.
- insert:
    - id: dsh-live-proxy
      name: '@local/dsh-live-proxy'
      config:
        # direct: ignore the proxy entirely; manual: use proxyUrl below.
        mode: manual
        # HTTP(S) port of your proxy software. SOCKS is rejected by DSH.
        proxyUrl: http://127.0.0.1:7897
        # Extra bypass entries; loopback is always bypassed by DSH itself.
        noProxy: 'zhihu.com,zhimg.com,jd.com,360buyimg.com,.local'
        # Connect directly while the proxy is unreachable, and go back when it returns.
        fallbackToDirect: true
        # TCP reachability check period in ms; 0 disables probing.
        probeIntervalMs: 15000
        probeTimeoutMs: 2000
